services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: eduadmin
      POSTGRES_PASSWORD: eduadmin_secret
      POSTGRES_DB: eduadmin_bimbel
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eduadmin -d eduadmin_bimbel"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: "postgresql://eduadmin:eduadmin_secret@postgres:5432/eduadmin_bimbel"
      JWT_ACCESS_SECRET: "eduadmin-access-secret-prod"
      JWT_REFRESH_SECRET: "eduadmin-refresh-secret-prod"
      CORS_ORIGIN: "http://localhost:3000"
      NODE_ENV: "production"
      SENTRY_DSN: "${SENTRY_DSN:-}"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: "/api"
      VITE_SENTRY_DSN: "${SENTRY_DSN:-}"
      VITE_GPS_LAT: "${VITE_GPS_LAT:--6.2088}"
      VITE_GPS_LON: "${VITE_GPS_LON:-106.8456}"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      - api

volumes:
  pgdata:

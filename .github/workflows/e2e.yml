name: E2E Tests

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'session.md']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'session.md']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright E2E Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: eduadmin
          POSTGRES_PASSWORD: eduadmin_secret
          POSTGRES_DB: eduadmin_bimbel
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Generate Prisma Client & push schema
        working-directory: backend
        env:
          DATABASE_URL: postgresql://eduadmin:eduadmin_secret@localhost:5432/eduadmin_bimbel
        run: |
          npx prisma generate
          npx prisma db push
          npx tsx prisma/seed.ts

      - name: Run Playwright tests
        env:
          DATABASE_URL: postgresql://eduadmin:eduadmin_secret@localhost:5432/eduadmin_bimbel
          JWT_ACCESS_SECRET: e2e-test-access-secret
          JWT_REFRESH_SECRET: e2e-test-refresh-secret
        run: npx playwright test

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-screenshots
          path: test-results/
          retention-days: 7

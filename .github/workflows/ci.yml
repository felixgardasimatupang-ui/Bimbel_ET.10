name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "22"
  DATABASE_URL: "postgresql://eduadmin:eduadmin_secret@localhost:5432/eduadmin_bimbel"

jobs:
  test-frontend:
    name: Frontend — Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - run: npm run test

  test-backend:
    name: Backend — Lint & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: eduadmin
          POSTGRES_PASSWORD: eduadmin_secret
          POSTGRES_DB: eduadmin_bimbel
        options: >-
          --health-cmd pg_isready -U eduadmin -d eduadmin_bimbel
          --health-interval 5s --health-timeout 5s --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: ./backend
      - run: npx prisma migrate deploy
        working-directory: ./backend
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
      - run: npx tsc --noEmit
        working-directory: ./backend
      - run: npm run test
        working-directory: ./backend
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          NODE_ENV: test
          JWT_ACCESS_SECRET: ci-test-secret
          JWT_REFRESH_SECRET: ci-test-secret

  build:
    name: Build Docker Images
    needs: [test-frontend, test-backend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t bimbel-api ./backend
      - name: Build Frontend image
        run: docker build -t bimbel-frontend .

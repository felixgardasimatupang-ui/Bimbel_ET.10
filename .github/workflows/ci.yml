name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend — Lint & Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint
      - run: npm run lint:eslint

      - run: npm run test

      - run: npm run build

  backend:
    name: Backend — Type Check & Build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: eduadmin
          POSTGRES_PASSWORD: eduadmin_secret
          POSTGRES_DB: eduadmin_bimbel
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - working-directory: backend
        run: npm ci

      - working-directory: backend
        run: npx prisma generate

      - working-directory: backend
        run: npx tsc --noEmit

      - working-directory: backend
        env:
          DATABASE_URL: postgresql://eduadmin:eduadmin_secret@localhost:5432/eduadmin_bimbel
        run: npx prisma db push && npx tsx prisma/seed.ts
